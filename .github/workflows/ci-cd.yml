name: CI/CD Pipeline - FLAS KPS KU E-Office

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  # =========================================================================
  # STAGE 1: Code Quality, Schema Validation & Build Check
  # =========================================================================
  validate-and-build:
    name: 🔍 Validate & Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🗄️ Validate Prisma Schema
        run: npx prisma validate

      - name: 🔨 Generate Prisma Client
        run: npx prisma generate

      - name: 🏗️ Next.js Production Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/E-office?schema=public"
          JWT_SECRET: "ci-secret-build-key"
          SMTP_HOST: "smtp.gmail.com"
          SMTP_PORT: 587
          SMTP_USER: "ci-test@example.com"
          SMTP_PASS: "ci-test-pass"

  # =========================================================================
  # STAGE 2: Docker Container Build & Security Sanity
  # =========================================================================
  docker-build-test:
    name: 🐳 Docker Container Build Test
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: flas-kps-eoffice:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
